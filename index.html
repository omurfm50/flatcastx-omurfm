<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a12" />
    <title>ÖmürFm | Canlı Radyo</title>
    <link rel="preconnect" href="https://flatcastx.com" />
    <link rel="stylesheet" href="styles.css?v=7" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="page-shell">
      <header class="radio-header">
        <a class="brand" href="#player" aria-label="ÖmürFm ana sayfa">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
          <span class="brand-copy">
            <strong>ÖMÜR<span>FM</span></strong>
          </span>
        </a>

        <div class="live-pill" role="status">
          <i aria-hidden="true"></i>
          CANLI YAYIN
        </div>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">7/24 KESİNTİSİZ MÜZİK</p>
        <h1 id="page-title">ÖmürFm şimdi <em>yayında.</em></h1>
        <p class="intro">Sohbete katıl, yayını dinle ve müziğin keyfini çıkar.</p>

        <div class="player-toolbar">
          <div class="station-state">
            <span class="equalizer" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i>
            </span>
            <span>
              <strong>ÖmürFm Canlı Ses</strong>
              <small id="playerStatus">Dinlemek için CANLI SES'e dokunun</small>
            </span>
          </div>
          <span class="source-badge">CASTER.FM</span>
          <div class="toolbar-actions">
            <button class="power-button" id="playToggle" type="button">SES AÇ</button>
          </div>
        </div>

        <div class="player-frame is-open" id="player">
          <div class="frame-loader" aria-hidden="true">
            <span></span>
            Yayına bağlanıyor…
          </div>
          <div class="caster-player" id="casterPlayer" aria-label="ÖmürFm canlı sesi aç veya kapat">
            <iframe
              src="https://flatcastx.com/sid/1567"
              width="100%"
              height="520"
              frameborder="0"
              allow="autoplay"
              title="FlatcastX Canlı Yayın"
            ></iframe>
          </div>
        </div>

        <p class="autoplay-note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v4m0 4h.01M10.3 3.5 2.4 17.2A2 2 0 0 0 4.1 20h15.8a2 2 0 0 0 1.7-2.8L13.7 3.5a2 2 0 0 0-3.4 0Z" /></svg>
          Yayın sesini açmak veya kapatmak için yayındaki SES düğmesini kullanın.
        </p>
      </section>

      <footer>
        <span>© <span id="year"></span> ÖMÜRFM</span>
        <span class="footer-dot">Yayın açık</span>
      </footer>
    </main>

  </body>
</html>
