    var fxTabGuardChannel=null,fxTabGuardOwner='o_'+Math.random().toString(36).slice(2),fxTabGuardWaiters={};
    function fxInstallTabGuard(){
        if(fxTabGuardChannel || typeof BroadcastChannel==='undefined') return fxTabGuardChannel;
        try{
            fxTabGuardChannel=new BroadcastChannel('flatcastx_window_guard_v253');
            fxTabGuardChannel.onmessage=function(ev){
                var d=ev&&ev.data?ev.data:{};

    function fxEnsureUniqueListenerWindowId(){
        var ch=fxInstallTabGuard(),id=currentWindowId();
        if(!ch) return Promise.resolve(id);

            var probe='p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2),done=false;
            function finish(collision){

            try{ch.postMessage({type:'probe',id:id,probe:probe,owner:fxTabGuardOwner});}catch(e){finish(false);return;}

    function activeOtherWindow(){

    function block(lock){
        if (!SINGLE_SESSION_ENABLED) {
            blocked = false;
            window.__FX_SECOND_ENTRY_BLOCKED__ = false;
            window.__FX_SKIP_OFFLINE_BEACON__ = false;

        window.__FX_SECOND_ENTRY_BLOCKED__=true;
        window.__FX_SKIP_OFFLINE_BEACON__=true;
        try{ sessionStorage.setItem('fx_second_entry_blocked','1'); }catch(e){}

            }
        }catch(e){}

    function stableHash(text){
        var h1=0x811c9dc5,h2=0x9e3779b9;
        for(var i=0;i<text.length;i++){var c=text.charCodeAt(i);h1=Math.imul(h1^c,0x01000293);h2=Math.imul(h2^c,0x85ebca6b);}
        return ('00000000'+(h1>>>0).toString(16)).slice(-8)+('00000000'+(h2>>>0).toString(16)).slice(-8);
    }
    function fxRandomBrowserHex(){
        try{
            var bytes=new Uint8Array(16);crypto.getRandomValues(bytes);var out='';
            for(var i=0;i<bytes.length;i++)out+=('0'+bytes[i].toString(16)).slice(-2);
            return out;
        }catch(e){
            return stableHash(String(Date.now())+'|'+String(Math.random())+'|'+String(performance&&performance.now?performance.now():0))
                +stableHash(String(Math.random())+'|'+String(navigator.userAgent||''));
        }
    }
    function fxReadBrowserCookie(name){
        try{var m=document.cookie.match(new RegExp('(?:^|; )'+name+'=([^;]*)'));return m?decodeURIComponent(m[1]):'';}catch(e){return '';}
    }
    function fxWriteBrowserCookie(name,value){
        try{document.cookie=name+'='+encodeURIComponent(value)+'; Max-Age=31536000; Path=/; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');}catch(e){}
    }
    function fxListenerOsFamilyV252(){
        var ua=String(navigator.userAgent||'').toLowerCase();
        if(/android/.test(ua))return 'android';
        if(/iphone|ipad|ipod/.test(ua)||(/macintosh|mac os x/.test(ua)&&Number(navigator.maxTouchPoints||0)>1))return 'ios';
        if(/windows nt|windows/.test(ua))return 'windows';
        if(/cros/.test(ua))return 'chromeos';
        if(/macintosh|mac os x/.test(ua))return 'macos';
        if(/linux/.test(ua))return 'linux';
        return 'other';
    }
    function getListenerFingerprint(){
        var current=String(window.__FX_LISTENER_FINGERPRINT_V252__||'');
        if(/^fpv252_[a-f0-9]{32}$/i.test(current))return current.toLowerCase();
        var sc=window.screen||{},tz='',lang='';
        try{tz=String(Intl.DateTimeFormat().resolvedOptions().timeZone||'').toLowerCase();}catch(e){}
        try{lang=String((navigator.languages&&navigator.languages[0])||navigator.language||'').toLowerCase().split('-')[0];}catch(e){}
        var w=Number(sc.width||0),h=Number(sc.height||0),aw=Number(sc.availWidth||w),ah=Number(sc.availHeight||h);
        var raw=[
            fxListenerOsFamilyV252(),Math.min(w,h),Math.max(w,h),Math.min(aw,ah),Math.max(aw,ah),
            Number(sc.colorDepth||0),Number(sc.pixelDepth||sc.colorDepth||0),Number(navigator.maxTouchPoints||0),
            Number(navigator.hardwareConcurrency||0),tz,lang
        ].join('|');
        var fp='fpv252_'+stableHash(raw)+stableHash('flatcastx|'+raw.split('').reverse().join(''));
        window.__FX_LISTENER_FINGERPRINT_V252__=fp;
        return fp;
    }
    function getListenerCrossFingerprint(){
        var current=String(window.__FX_LISTENER_CROSS_FINGERPRINT_V259__||'');
        if(/^xfpv259_[a-f0-9]{32}$/i.test(current))return current.toLowerCase();
        var sc=window.screen||{},tz='',lang='',os=fxListenerOsFamilyV252();
        try{tz=String(Intl.DateTimeFormat().resolvedOptions().timeZone||'').toLowerCase();}catch(e){}
        try{lang=String((navigator.languages&&navigator.languages[0])||navigator.language||'').toLowerCase().split('-')[0];}catch(e){}
        var w=Number(sc.width||0),h=Number(sc.height||0),aw=Number(sc.availWidth||w),ah=Number(sc.availHeight||h);
        /* Cross-browser proof deliberately omits browser-sensitive values such as
           hardwareConcurrency/userAgent/deviceMemory. If the stable hints are too
           weak, return empty and keep the existing browser-key protection only. */
        if(os==='other'||w<240||h<240||!tz||!lang)return '';
        var raw=[
            os,Math.min(w,h),Math.max(w,h),Math.min(aw,ah),Math.max(aw,ah),
            Number(sc.colorDepth||0),Number(navigator.maxTouchPoints||0),tz,lang
        ].join('|');
        var fp='xfpv259_'+stableHash(raw)+stableHash('flatcastx-cross|'+raw.split('').reverse().join(''));
        window.__FX_LISTENER_CROSS_FINGERPRINT_V259__=fp;
        return fp;
    }
    function getListenerPhysicalSlotFingerprint(){
        var current=String(window.__FX_LISTENER_PHYSICAL_SLOT_FINGERPRINT_V260__||'');
        if(/^psfv260_[a-f0-9]{32}$/i.test(current))return current.toLowerCase();
        var sc=window.screen||{},tz='',os=fxListenerOsFamilyV252();
        try{tz=String(Intl.DateTimeFormat().resolvedOptions().timeZone||'').toLowerCase();}catch(e){}
        var w=Number(sc.width||0),h=Number(sc.height||0);
        /* Cross-browser fiziksel slot: browser dili/UA/deviceMemory/availWidth kullanılmaz.
           Aynı PC'de Chrome/Edge/Firefox arasında çoğunlukla sabit kalan OS + ekran +
           renk + touch + CPU thread sayısı + timezone birlikte kullanılır. */
        if(os==='other'||w<240||h<240||!tz)return '';
        var raw=[os,Math.min(w,h),Math.max(w,h),Number(sc.colorDepth||0),Number(navigator.maxTouchPoints||0),Number(navigator.hardwareConcurrency||0),tz].join('|');
        var fp='psfv260_'+stableHash(raw)+stableHash('flatcastx-physical-slot-v260|'+raw.split('').reverse().join(''));
        window.__FX_LISTENER_PHYSICAL_SLOT_FINGERPRINT_V260__=fp;

    }
    function getDeviceId(){
        var key='fx_browser_device_key_v251',id='',previous='';
        try{previous=String(localStorage.getItem('fx_device_family_id_v250')||localStorage.getItem('fx_device_id')||'');}catch(e){}
        if(/^pcf[234]_[a-f0-9]{16}$/i.test(previous))window.__FX_PREVIOUS_DEVICE_ID__=previous;
        try{id=String(localStorage.getItem(key)||'');}catch(e){}
        if(!/^brw_[a-f0-9]{32}$/i.test(id)) id=fxReadBrowserCookie(key);
        if(!/^brw_[a-f0-9]{32}$/i.test(id)){
            try{id=String(sessionStorage.getItem(key)||'');}catch(e){}
        }
        if(!/^brw_[a-f0-9]{32}$/i.test(id)) id='brw_'+fxRandomBrowserHex().slice(0,32);
        try{localStorage.setItem(key,id);localStorage.setItem('fx_device_id',id);}catch(e){}
        try{sessionStorage.setItem(key,id);}catch(e){}
        fxWriteBrowserCookie(key,id);
        window.__FX_BROWSER_DEVICE_ID__=id;
        window.__FX_DEVICE_FAMILY_ID__=id;
        window.__FX_DEVICE_LEGACY_ID__='';
        window.__FX_DEVICE_LEGACY2_ID__='';

    }
    function getLegacyDeviceId(){return '';}
    function getLegacy2DeviceId(){return '';}
    function stableGuestNameForDevice(deviceId){
        var prefix='gast';try{var lang=String(navigator.language||(navigator.languages&&navigator.languages[0])||'').toLowerCase();if(lang.indexOf('tr')===0)prefix='guest';}catch(e){}
        var m=String(deviceId||'').match(/^pcf[234]_([0-9a-f]{8})/i),seed=m?parseInt(m[1],16):parseInt(stableHash(String(deviceId||'guest')).slice(0,8),16);
        var num=100000+((seed+(ROOM_ID*131))%900000);return prefix+'_'+String(num).padStart(6,'0');
    }
    function writeLocalLock(role){
        try{
            localStorage.setItem(GLOBAL_LOCK_KEY,JSON.stringify({
                id:currentWindowId(),roomId:ROOM_ID,role:role||'listener',ts:Date.now(),href:location.href

    function serverCheck(){
        var existing=activeOtherWindow();
        if(existing) return Promise.resolve(block(existing));
        var body=new URLSearchParams();
        body.set('room_id',String(ROOM_ID));
        body.set('fx_device_id',getDeviceId());
        body.set('fx_device_legacy_id',getLegacyDeviceId());
        body.set('fx_device_legacy2_id',getLegacy2DeviceId());
        body.set('fx_device_fingerprint',getListenerFingerprint());
        var crossFp=getListenerCrossFingerprint();if(crossFp)body.set('fx_device_cross_fingerprint',crossFp);
        var physicalSlotFp=getListenerPhysicalSlotFingerprint();if(physicalSlotFp)body.set('fx_device_physical_slot_fingerprint',physicalSlotFp);

        body.set('window_id',currentWindowId());
        var preflightViewerName="gast_612967";
        if(true && !/^(guest|gast)_\d{6}$/i.test(String(preflightViewerName||''))) {
            preflightViewerName=stableGuestNameForDevice(getDeviceId());
        }
        body.set('viewer_name',preflightViewerName);
        body.set('viewer_user_id',String(-1207295549));
        body.set('viewer_color',"#9aa0a6");
        return fetch('/actions/listener_entry_check.php?t='+Date.now(),{

            }
            if(j && /^(guest|gast)_\d{6}$/i.test(String(j.viewer_name||''))){

                try{window.dispatchEvent(new CustomEvent('fx:listener-presence-ready',{detail:{roomId:ROOM_ID}}));}catch(e){}
            }

        return decodeURIComponent(Array.prototype.map.call(atob(v), function(c){
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
    }catch(e){ return ''; }
}

function fxGetGuestName(){

    try{
        if(window.__FX_STABLE_GUEST_NAME__ && /^(guest|gast)_\d{6}$/i.test(String(window.__FX_STABLE_GUEST_NAME__))){

        const num=100000+((seed+(Number(ROOM_ID||0)*131))%900000);
        const current=(prefix+'_'+String(num).padStart(6,'0')).toLowerCase();
        const key='fx_guest_name_'+(typeof ROOM_ID!=='undefined'?ROOM_ID:'global');
        localStorage.setItem(key,current);

const FX_MAX_MESSAGE_LEN = 299;

/*
| HARD 299 INPUT LIMIT
| Boşluk, nokta, tire, yıldız, rakam, slash, parantez, ünlem vb. her şey 1 karakter sayılır.
| 299'dan sonrası inputa hiç girmez; uyarı/popup çıkarılmaz.
*/
function fxMessageChars(v){
    return Array.from(String(v || ''));
}
function fxMessageLen(v){
    return fxMessageChars(v).length;
}
function fxSliceMessage(v, maxLen){
    return fxMessageChars(v).slice(0, maxLen || FX_MAX_MESSAGE_LEN).join('');
}
function fxClampChatInput(){
    if(!chatInput) return;
    var oldPos = chatInput.selectionStart || 0;
    var raw = String(chatInput.value || '');
    if(fxMessageLen(raw) > FX_MAX_MESSAGE_LEN){
        chatInput.value = fxSliceMessage(raw, FX_MAX_MESSAGE_LEN);
        var pos = Math.min(oldPos, chatInput.value.length);
        try{ chatInput.setSelectionRange(pos, pos); }catch(_e){}
    }
}
function fxInsertIntoChatInputCapped(text){
    if(!chatInput) return;
    text = String(text || '');
    var start = chatInput.selectionStart || 0;
    var end = chatInput.selectionEnd || start;
    var current = String(chatInput.value || '');
    var before = current.slice(0, start);
    var after = current.slice(end);
    var room = FX_MAX_MESSAGE_LEN - fxMessageLen(before + after);
    if(room <= 0){
        fxClampChatInput();
        return;
    }
    var add = fxSliceMessage(text, room);
    chatInput.value = before + add + after;
    var pos = before.length + add.length;
    try{ chatInput.setSelectionRange(pos, pos); }catch(_e){}
    chatInput.dispatchEvent(new Event('input', {bubbles:true}));
}
if(chatInput){
    chatInput.setAttribute('maxlength', String(FX_MAX_MESSAGE_LEN));
    chatInput.addEventListener('keydown', function(e){
        if(e.ctrlKey || e.metaKey || e.altKey) return;
        var key = e.key || '';
        var controlKeys = ['Backspace','Delete','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Tab','Enter','Escape'];
        if(controlKeys.indexOf(key) !== -1) return;
        if(key.length === 1){
            var start = this.selectionStart || 0;
            var end = this.selectionEnd || start;
            var current = String(this.value || '');
            var next = current.slice(0, start) + key + current.slice(end);
            if(fxMessageLen(next) > FX_MAX_MESSAGE_LEN){
                e.preventDefault();
                fxClampChatInput();
            }
        }
    }, true);
    chatInput.addEventListener('beforeinput', function(e){
        if(e.inputType && e.inputType.indexOf('delete') === 0) return;
        var inserted = e.data || '';
        if(e.inputType === 'insertFromPaste' && e.clipboardData){ inserted = e.clipboardData.getData('text') || ''; }
        if(!inserted) return;
        var start = this.selectionStart || 0;
        var end = this.selectionEnd || start;
        var current = String(this.value || '');
        var next = current.slice(0, start) + inserted + current.slice(end);
        if(fxMessageLen(next) > FX_MAX_MESSAGE_LEN){
            e.preventDefault();
            fxInsertIntoChatInputCapped(inserted);
        }
    }, true);
    chatInput.addEventListener('paste', function(e){
        var text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
        if(text){
            e.preventDefault();
            fxInsertIntoChatInputCapped(text);
        }
    }, true);
    chatInput.addEventListener('drop', function(e){
        var text = (e.dataTransfer || window.dataTransfer)?.getData('text') || '';
        if(text){
            e.preventDefault();
            fxInsertIntoChatInputCapped(text);
        }
    }, true);
    chatInput.addEventListener('input', fxClampChatInput, true);
    chatInput.addEventListener('keyup', fxClampChatInput, true);
    chatInput.addEventListener('compositionend', fxClampChatInput, true);
    fxClampChatInput();
}

function showPanel(panel){
    const rr = roomEl.getBoundingClientRect();
    const chatArea = document.querySelector('.fx-chat') || chatBox || roomEl;
    const cr = chatArea.getBoundingClientRect();

    panel.style.display = 'grid';
    panel.style.visibility = 'hidden';
    panel.style.left = '0px';
    panel.style.top = '0px';

    const pw = panel.offsetWidth || 220;
    const ph = panel.offsetHeight || 120;

    let left = (cr.left - rr.left) + ((cr.width - pw) / 2);
    let top  = (cr.top - rr.top) + ((cr.height - ph) / 2);

    left = Math.max(4, Math.min(left, rr.width - pw - 4));
    top  = Math.max(4, Math.min(top, rr.height - ph - 4));

    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
    panel.style.visibility = 'visible';
}

    // get_messages.php mesajları id ASC döndürdüğü için, node'ları sırayla afterbegin
    // eklemek ekranda en yeni mesajı en üstte bırakır. Böylece 20:21 mesajı,
    // 20:20 mesajlarının altına değil üstüne gelir.
    const nodes = Array.from(tmp.childNodes).filter(function(node){
        return !(node.nodeType === 3 && !String(node.textContent || '').trim());
    });
    if(!nodes.length) return;

    nodes.forEach(function(node){
        chatBox.insertBefore(node, chatBox.firstChild);
    });

    // Yeni mesaj üstte olduğu için scroll da üstte kalsın.
    chatBox.scrollTop = 0;
}

async function loadMessages(forceNow){

    if(fxMessagesRequestBusyV5645c){
        if(forceNow) fxMessagesRequestAgainV5645c = true;
        return;
    }
    fxMessagesRequestBusyV5645c = true;
    const fxInitialRecentV5645c = !(parseInt(lastMsgId || '0', 10) > 0);
    try{
        let msgUrl = '/chat/get_messages.php?room_id=' + ROOM_ID + '&last_id=' + lastMsgId + '&panel=oda&t=' + Date.now();
        if(fxInitialRecentV5645c) msgUrl += '&initial_recent=1';
        try {
            const viewerName = (FX_AUTH_IS_GUEST ? fxGetGuestName() : (FX_AUTH_USERNAME || CURRENT_ROOM_USERNAME || '')).trim();
            if(viewerName) msgUrl += '&viewer_name=' + encodeURIComponent(viewerName);
            msgUrl += '&viewer_user_id=' + encodeURIComponent(String(FX_AUTH_USER_ID || CURRENT_ROOM_USER_ID || 0));

        } catch(e) {}
        const res = await fetch(msgUrl, {cache:'no-store', credentials:'include'});
        const html = await res.text();
        if(!html.trim()) return;
        if(html.includes('USER_BANNED_FROM_ROOM')) {
            chatBox.innerHTML = '<div style="color:#ff6666">Bu radyodan yasaklandınız.</div>';
            return;
        }
        if(html.includes('COMMAND_CLEAR_CHAT')) {
            const tmpClear = document.createElement('div');
            tmpClear.innerHTML = html.replace('COMMAND_CLEAR_CHAT', '').replace('FX_CLEAR_CHAT_NOTICE', '');
            const clearLast = tmpClear.querySelector('#last_id');
            chatBox.innerHTML = '';
            fxAppendLocalClearNoticeV128('Sohbet temizlendi.');
            lastMsgId = clearLast ? parseInt(clearLast.dataset.id || '0', 10) : 0;
            return;
        }
        const tmp = document.createElement('div');
        tmp.innerHTML = html.replace('FX_CLEAR_CHAT_NOTICE', '');

        tmp.querySelectorAll('.fx-delete-user-messages-cmd').forEach(cmd => {
            const key = cmd.getAttribute('data-target-key') || '';
            const name = (cmd.getAttribute('data-target-name') || '').toLowerCase();
            const decodedName = decodeURIComponent(name || '');
            document.querySelectorAll('#chat-box .msg-item').forEach(item => {
                const itemKey = item.getAttribute('data-sender-key') || '';
                const text = (item.textContent || '').trim().toLowerCase();
                if ((key && itemKey === key) || (name && text.indexOf(name + ':') === 0) || (decodedName && text.indexOf(decodedName + ':') === 0)) {
                    item.remove();
                }
            });
            cmd.remove();
        });

        const last = tmp.querySelector('#last_id');
        if(last) {
            const nextLastId = parseInt(last.dataset.id || '0', 10) || 0;
            if(fxInitialRecentV5645c || nextLastId > lastMsgId) lastMsgId = nextLastId;
            last.remove();
        }
        fxAppendNewMessagesFromTemp(tmp);
    }catch(e){}finally{
        fxMessagesRequestBusyV5645c = false;
        if(fxMessagesRequestAgainV5645c){
            fxMessagesRequestAgainV5645c = false;
            setTimeout(function(){ loadMessages(false); }, 0);
        }
    }
}

function fxIsPrivateTargetSelf(target, userId){
    try{
        const targetKey = fxFxNormName(target);
        if(!targetKey) return false;
        const uid = parseInt(userId || '0', 10) || 0;
        const selfIds = [
            (typeof CURRENT_ROOM_USER_ID !== 'undefined' ? CURRENT_ROOM_USER_ID : 0),
            (typeof FX_AUTH_USER_ID !== 'undefined' ? FX_AUTH_USER_ID : 0)
        ].map(function(v){ return parseInt(v || '0', 10) || 0; }).filter(function(v){ return v > 0; });
        if(uid > 0 && selfIds.indexOf(uid) !== -1) return true;

        const selfNames = [
            (typeof CURRENT_ROOM_USERNAME !== 'undefined' ? CURRENT_ROOM_USERNAME : ''),
            (typeof FX_AUTH_USERNAME !== 'undefined' ? FX_AUTH_USERNAME : ''),
            (window && window.CURRENT_ROOM_USERNAME ? window.CURRENT_ROOM_USERNAME : ''),
            (window && window.FX_AUTH_USERNAME ? window.FX_AUTH_USERNAME : '')
        ];
        return selfNames.some(function(n){ return fxFxNormName(n) === targetKey; });
    }catch(e){ return false; }
}

function fxNormalizeSendResult(raw){
    const txt = (raw || '').trim();
    if(!txt) return {ok:false, message:'Boş cevap'};
    if(txt === 'ok' || txt === 'true' || txt === '1') return {ok:true, message:'ok', id:0};
    try{
        const data = JSON.parse(txt);
        const ok = data.ok === true || data.success === true || data.status === 'ok';
        const id = parseInt(data.message_id || data.id || data.last_id || '0', 10) || 0;
        return {ok:ok, message:String(data.message || data.error || txt), id:id};
    }catch(e){
        return {ok:false, message:txt, id:0};
    }
}

            if(!lastMsgId || lastMsgId <= 0 || lastMsgId >= id){
                lastMsgId = before;

}

async function sendMessage(){
    const fxNow = Date.now();
    if(isSending || !chatInput || chatInput.disabled || !chatInput.value.trim()) return;
    if((fxNow - fxLastSendAt) < 1000) return;
    fxLastSendAt = fxNow;

    /*
    | Misafir sohbet kapalı olsa bile mesaj önce server'a gitsin.
    | Server karar verir:
    | - Çizik kaldırılmış misafir yazabilir.
    | - Normal misafir GUEST_LOGIN_REQUIRED döner ve login açılır.
    */

    isSending = true;
    if(fxPrivateTarget && fxIsPrivateTargetSelf(fxPrivateTarget, 0)){
        fxSetPrivateTarget('', true);
        isSending = false;
        return;
    }
    fxClampChatInput();
    fxClampChatInput();
    let text = fxSliceMessage(String(chatInput.value || ''), FX_MAX_MESSAGE_LEN);
    if(isBold) text = '<b>' + text + '</b>';
    if(isItalic) text = '<i>' + text + '</i>';
    let finalMsg = text;
    if(isBold && fxMessageLen(finalMsg) + 7 <= FX_MAX_MESSAGE_LEN) finalMsg = '<b>' + finalMsg + '</b>';
    if(isItalic && fxMessageLen(finalMsg) + 7 <= FX_MAX_MESSAGE_LEN) finalMsg = '<i>' + finalMsg + '</i>';

    try{
        const fd = new URLSearchParams();
        fd.append('room_id', ROOM_ID);
        fd.append('message', finalMsg);
        fd.append('color', selectedColor);
        fd.append('fx_context', 'listener');
        if(FX_FORCE_GUEST_LISTENER) fd.append('fx_force_guest_listener', '1');
        if(fxPrivateTarget) fd.append('private_to', fxPrivateTarget);
        fd.append('fx_device_id', FX_DEVICE_ID); fd.append('fx_device_legacy_id', FX_DEVICE_LEGACY_ID); fd.append('fx_device_legacy2_id', FX_DEVICE_LEGACY2_ID);
        if(FX_AUTH_IS_GUEST) {
            const gName = fxGetGuestName();
            fd.append('guest_name', gName);
            /* send_message.php online satırını kendisi tazeler; heartbeat mesajı geciktirmesin. */
        } else {
            fd.append('username', FX_AUTH_USERNAME || CURRENT_ROOM_USERNAME || '');
            fd.append('user_id', String(FX_AUTH_USER_ID || CURRENT_ROOM_USER_ID || 0));
            if(FX_LOGIN_TOKEN) fd.append('fx_login_token', FX_LOGIN_TOKEN);
        }
        const res = await fetch('/chat/send_message.php?t=' + Date.now(), {method:'POST', body:fd, credentials:'include', cache:'no-store', headers:{'X-Requested-With':'XMLHttpRequest'}});
        const result = fxNormalizeSendResult(await res.text());
        if(!res.ok || !result.ok){
            if(result.message === 'GUEST_LOGIN_REQUIRED') fxGuestChatEnabled = false;
            fxHandleSendFail(result.message, 'Mesaj gönderilemedi');
            return;
        }
        chatInput.value = '';
        if(FX_AUTH_IS_GUEST){ try{ fxSendOnlineHeartbeat('after_send'); }catch(e){} }
        fxPreparePollForSentMessageV137(result);
        try{ fxSignalNewMessageRealtimeV25811(result); }catch(e){}
        await loadMessages(true);
        await loadOnline();
    }catch(e){
        fxHandleSendFail('Bağlantı hatası. Mesaj gönderilemedi.', 'Mesaj gönderilemedi');
    }finally{
        isSending = false;
    }
}

/*

| Mobil tarayıcılarda pagehide sadece kapatma değil, uygulama arkaplana alınırken de
| tetiklenir. Bu yüzden pagehide ile offline göndermek mobil kullanıcıyı listeden
| düşürüyordu. Online kaydı artık X/çıkış veya server-side timeout ile yönetilir.
*/
function fxSendOfflineBeacon(reason){
    try{
        if(window.__FX_SECOND_ENTRY_BLOCKED__ === true || window.__FX_SKIP_OFFLINE_BEACON__ === true || sessionStorage.getItem('fx_second_entry_blocked') === '1'){
            return;
        }
        const body = new URLSearchParams();
        body.append('room_id', ROOM_ID);
        body.append('action', reason === 'explicit_close' ? 'offline' : 'offline_pending');
        if(reason === 'explicit_close') body.append('fx_explicit_close','1');
        body.append('fx_device_id', FX_DEVICE_ID); body.append('fx_device_legacy_id', FX_DEVICE_LEGACY_ID); body.append('fx_device_legacy2_id', FX_DEVICE_LEGACY2_ID); body.append('fx_device_fingerprint', FX_DEVICE_FINGERPRINT); if(FX_DEVICE_CROSS_FINGERPRINT)body.append('fx_device_cross_fingerprint', FX_DEVICE_CROSS_FINGERPRINT); if(FX_DEVICE_PHYSICAL_SLOT_FINGERPRINT)body.append('fx_device_physical_slot_fingerprint', FX_DEVICE_PHYSICAL_SLOT_FINGERPRINT);
        body.append('fx_exit_reason', reason || 'close');
        if(FX_FORCE_GUEST_LISTENER) body.append('fx_force_guest_listener', '1');
        try{const fxw=fxRoomWindowId();if(fxw)body.append('window_id',fxw);}catch(e){}
        if(fxIsMobileBrowser()){
            body.append('fx_client_type', 'mobile');
            body.append('fx_mobile_exit', '1');
            try{ sessionStorage.removeItem('fx_mobile_radio_closed_no_auto_rejoin_' + ROOM_ID); }catch(e){}
        }
        if(FX_AUTH_IS_GUEST) body.append('guest_name', fxGetGuestName());
        else{
            body.append('username', FX_AUTH_USERNAME || CURRENT_ROOM_USERNAME || '');
            body.append('user_id', String(CURRENT_ROOM_USER_ID || 0));
        }
        const data = body.toString();
        try{ if(navigator.sendBeacon){ navigator.sendBeacon('/update_online_status.php', new Blob([data], {type:'application/x-www-form-urlencoded; charset=UTF-8'})); } }catch(e){}
        try{ fetch('/update_online_status.php', {method:'POST', body, keepalive:true, credentials:'include', cache:'no-store'}).catch(()=>{}); }catch(e){}
    }catch(e){}
}

function fxThemeScaleInfo(item){
    const extra = (item && item.extra) ? item.extra : {};
    const baseW = Math.max(1, parseInt(extra.base_width || FX_ROOM_W || 800, 10));
    const baseH = Math.max(1, parseInt(extra.base_height || FX_ROOM_H || 600, 10));
    const sx = Math.max(1, parseInt(FX_ROOM_W || baseW, 10)) / baseW;
    const sy = Math.max(1, parseInt(FX_ROOM_H || baseH, 10)) / baseH;
    return {sx:sx, sy:sy, sf:(sx + sy) / 2};
}

function fxCssFromItem(item){
    const sc = fxThemeScaleInfo(item || {});
    const x = Math.round(parseFloat(item.x || 0) * sc.sx);
    const y = Math.round(parseFloat(item.y || 0) * sc.sy);
    const w = Math.max(1, Math.round(parseFloat(item.width || 1) * sc.sx));
    const h = Math.max(1, Math.round(parseFloat(item.height || 1) * sc.sy));
    const z = parseInt(item.z || item.z_index || 1, 10);
    const extra = item.extra || {};
    let css = 'position:absolute;left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;z-index:'+z+';';
    if(extra.font_size) css += 'font-size:'+Math.max(6, Math.round(parseFloat(extra.font_size || 14) * sc.sf))+'px;';
    if(extra.color) css += 'color:'+extra.color+';';
    return css;
}

function fxPad2(n){ return String(n).padStart(2,'0'); }
function fxRuntimeClockText(item){
    const d = new Date();

    if(fmt === 'HH:mm:ss') return fxPad2(d.getHours()) + ':' + fxPad2(d.getMinutes()) + ':' + fxPad2(d.getSeconds());
    return fxPad2(d.getHours()) + ':' + fxPad2(d.getMinutes());
}
function fxRuntimeDateText(item){

    const dd = fxPad2(d.getDate()), mm = fxPad2(d.getMonth()+1), yy = String(d.getFullYear());
    if(fmt === 'yyyy-mm-dd') return yy + '-' + mm + '-' + dd;
    return dd + '.' + mm + '.' + yy;
}

function fxScrollbarTargetHasOverflow(target){

}
function fxBuildScrollbarArrows(el){

    el.classList.add('fx-runtime-chat-scrollbar');

function fxAttachScrollbarControl(el){
    if(!el) return;
    el.style.pointerEvents = 'auto';
    el.style.cursor = 'default';
    el.title = 'Sohbet dolunca geçmişi yukarı/aşağı kaydırır';
    const buttons = fxBuildScrollbarArrows(el);

    function fxFitScrollbarButtons(){
        const w = Math.max(1, el.clientWidth || parseInt(el.style.width || '12') || 12);
        const h = Math.max(12, el.clientHeight || parseInt(el.style.height || '40') || 40);
        const fs = Math.max(7, Math.min(16, Math.round(Math.min(w + 3, h / 3))));
        const btnH = Math.max(12, Math.min(22, Math.round(Math.min(22, h / 5))));
        [buttons.up, buttons.down].forEach(function(b){
            b.style.height = btnH + 'px';
            b.style.lineHeight = Math.max(10, btnH - 2) + 'px';
            b.style.fontSize = fs + 'px';
        });
        if(buttons.track){
            buttons.track.style.top = (btnH + 2) + 'px';
            buttons.track.style.bottom = (btnH + 2) + 'px';
        }
    }

    function fxSyncScrollbarVisibility(){
        const target = fxScrollbarFindTarget(el);
        const active = fxScrollbarTargetHasOverflow(target);
        el.style.display = active ? 'block' : 'none';
        if(active){
            const atTop = target.scrollTop <= 1;
            const atBottom = target.scrollTop + target.clientHeight >= target.scrollHeight - 2;
            buttons.up.style.opacity = atTop ? '.38' : '1';
            buttons.down.style.opacity = atBottom ? '.38' : '1';
            if(buttons.thumb){
                const h = Math.max(30, el.clientHeight || parseInt(el.style.height || '80') || 80);
                const btnH = Math.max(12, Math.min(22, Math.round(Math.min(22, h / 5))));
                const trackTop = btnH + 4;
                const trackH = Math.max(12, h - ((btnH + 4) * 2));
                const ratio = Math.min(1, target.clientHeight / Math.max(1, target.scrollHeight));
                const thumbH = Math.max(22, Math.round(trackH * ratio));
                const maxTop = trackTop + trackH - thumbH;
                const scrollRatio = target.scrollTop / Math.max(1, target.scrollHeight - target.clientHeight);
                buttons.thumb.style.height = thumbH + 'px';
                buttons.thumb.style.top = Math.round(trackTop + ((maxTop - trackTop) * scrollRatio)) + 'px';
            }
        }
        fxFitScrollbarButtons();
    }

    function scrollTarget(dir){
        const target = fxScrollbarFindTarget(el);
        if(!target || !fxScrollbarTargetHasOverflow(target)) return;
        const step = Math.max(45, Math.round(target.clientHeight * 0.45));
        target.scrollTop += dir * step;
        setTimeout(fxSyncScrollbarVisibility, 30);
    }

    buttons.up.onclick = function(ev){ ev.preventDefault(); ev.stopPropagation(); scrollTarget(-1); };
    buttons.down.onclick = function(ev){ ev.preventDefault(); ev.stopPropagation(); scrollTarget(1); };
    if(buttons.track){
        buttons.track.onclick = function(ev){
            ev.preventDefault(); ev.stopPropagation();
            const target = fxScrollbarFindTarget(el);
            if(!target || !fxScrollbarTargetHasOverflow(target)) return;
            const r = buttons.track.getBoundingClientRect();
            const middle = r.top + (r.height / 2);
            scrollTarget(ev.clientY < middle ? -1 : 1);
        };
    }
    el.onwheel = function(ev){
        const target = fxScrollbarFindTarget(el);
        if(!target || !fxScrollbarTargetHasOverflow(target)) return;
        ev.preventDefault();
        target.scrollTop += ev.deltaY;
        setTimeout(fxSyncScrollbarVisibility, 20);
    };

    const target = fxScrollbarFindTarget(el);
    if(target){
        target.addEventListener('scroll', fxSyncScrollbarVisibility, {passive:true});
        try{ new ResizeObserver(fxSyncScrollbarVisibility).observe(target); }catch(e){}
        try{ new MutationObserver(fxSyncScrollbarVisibility).observe(target, {childList:true, subtree:true, characterData:true}); }catch(e){}
    }
    fxFitScrollbarButtons();
    fxSyncScrollbarVisibility();
    setTimeout(fxSyncScrollbarVisibility, 150);
    setTimeout(fxSyncScrollbarVisibility, 700);
    if(!window.fxChatScrollbarSyncTimer){
        window.fxChatScrollbarSyncTimer = setInterval(function(){
            document.querySelectorAll('.fx-runtime-chat-scrollbar').forEach(function(bar){
                const target = fxScrollbarFindTarget(bar);
                bar.style.display = fxScrollbarTargetHasOverflow(target) ? 'block' : 'none';
            });
        }, 800);
    }
}

function fxApplyThemeItems(items){

    items.forEach(item => {
        const key = String(item.key || '');
        if(!key) return;
        const type = String(item.type || 'box');
        const extra = item.extra || {};
        const visible = Number(item.visible === undefined ? 1 : item.visible) === 1;

        let el = fxElementForThemeKey(key);

function bootVisualizer(){
        const barsBox = document.getElementById('audio-visualizer') || document.querySelector('.fx-visualizer');
        if(!barsBox) return;

        let bars = Array.from(barsBox.querySelectorAll('span'));
        if(!bars.length){
            for(let i=0;i<12;i++){
                const s = document.createElement('span');
                barsBox.appendChild(s);
            }
            bars = Array.from(barsBox.querySelectorAll('span'));
        }

        const audio = document.getElementById('radio-audio');
        let analyser = null;
        let dataArray = null;

        async function tryAudioContext(){
            if(!audio || analyser) return;
            try{
                const AC = window.AudioContext || window.webkitAudioContext;
                if(!AC) return;
                const ctx = new AC();
                const src = ctx.createMediaElementSource(audio);
                analyser = ctx.createAnalyser();
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                src.connect(analyser);
                analyser.connect(ctx.destination);
                if(ctx.state === 'suspended') await ctx.resume();
            }catch(e){
                analyser = null;
                dataArray = null;
            }
        }

        if(audio){
            audio.addEventListener('play', tryAudioContext, {once:true});
        }

        function animate(){
            if(analyser && dataArray){
                analyser.getByteFrequencyData(dataArray);
                bars.forEach((bar, i) => {
                    const v = dataArray[i % dataArray.length] || 0;
                    const h = Math.max(8, Math.round((v / 255) * 100));
                    bar.style.height = h + '%';
                    bar.style.opacity = String(Math.max(.35, v / 255));
                });
            }else{
                const t = Date.now() / 130;
                bars.forEach((bar, i) => {
                    const h = 18 + Math.abs(Math.sin(t + i * .75)) * 76;
                    bar.style.height = h + '%';
                    bar.style.opacity = '.75';
                });
            }
            requestAnimationFrame(animate);
        }
        animate();
    }

    bootVisualizer();
})();

(function(){
    if (typeof ROOM_ID === 'undefined') return;
    const KEY = 'fx_theme_preview_' + ROOM_ID;
    let bc = null;
    try { bc = new BroadcastChannel(KEY); } catch(e) {}

    function applyPayload(payload){
        if(!payload) return;
        if(Array.isArray(payload)) payload = {items: payload};
        if(!Array.isArray(payload.items)) return;
        if(typeof fxApplyThemeItems === 'function'){
            fxApplyThemeItems(payload.items);
        }
    }

    window.addEventListener('storage', function(e){
        if(e.key !== KEY || !e.newValue) return;
        try { applyPayload(JSON.parse(e.newValue)); } catch(x) {}
    });

    if(bc){
        bc.onmessage = function(e){ applyPayload(e.data); };
    }
})();
